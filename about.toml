# Licences acceptable for dependencies of siblingGWAS-rs. Where a crate offers a
# choice (e.g. "MIT OR Apache-2.0"), the licence listed first here is used.
accepted = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-3.0",
    "GPL-3.0-or-later",
]

# Platforms siblingGWAS-rs is built for (the Docker image uses musl), so that
# platform-specific dependencies for other targets (e.g. Windows) are left out
targets = [
    "x86_64-unknown-linux-musl",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

ignore-build-dependencies = true
ignore-dev-dependencies = true
