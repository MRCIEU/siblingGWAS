name: build+test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --release --locked
    - name: Test
      run: cargo test --release --locked
    - name: Run
      run: ./target/release/siblinggwas --help

  docker:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Docker build
      run: docker build -t mrcieu/siblinggwas .
    - name: Docker run
      run: docker run --rm mrcieu/siblinggwas siblinggwas --help
